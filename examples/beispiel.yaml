# Ambiframe – Beispielkonfiguration (alle Entitäten sind Platzhalter)
# Import: im Ambiframe-Editor unter „YAML“ einfügen und speichern
# oder Entwickler-Werkzeuge → Aktionen → ambiframe.import_config (Feld „yaml“).
# Beim ersten Start legt Ambiframe ohnehin eine Startkonfiguration aus den eigenen Entitäten an.
version: 1

design:
  theme: gold           # ruhig | klar | gold | weissgold | …
  evening: sun          # abends wärmer, sobald die Sonne unter dem Horizont ist

photos:
  folder: media-source://media_source/local/ambiframe   # HA → Medien → Lokale Medien → Ordner „ambiframe“
  bing: true            # solange der Ordner leer ist: Bing-Bilder des Tages
  credit: true

displays:
  - id: wohnzimmer
    name: Wohnzimmer
    playlist:
      - page: foto
      - page: wetter
      - page: foto
      - page: zuhause
      - page: muell
    night:
      entity: input_boolean.nachtruhe
      page: nacht
    control:
      enabled: true
      dashboard: /lovelace/0

pages:
  - id: foto
    name: Bilderrahmen
    duration: 90
    background:
      type: photo
    widgets:
      - { id: uhr, type: clock, x: 0, y: 4, w: 6, h: 2, options: { valign: end } }
      - { id: datum, type: date, x: 0, y: 6, w: 7, h: 1 }
      - id: zeile
        type: infoline
        x: 0
        y: 7
        w: 8
        h: 1
        options:
          items:
            - { type: weather, entity: weather.home }
            - { type: calendar, entity: calendar.muell, days: 2 }

  - id: wetter
    name: Wetter
    duration: 20
    widgets:
      - { id: titel, type: text, x: 0, y: 0, w: 6, h: 1, options: { text: Wetter, style: label } }
      - { id: uhr, type: clock, x: 9, y: 0, w: 3, h: 1, options: { size: small, align: end } }
      - { id: jetzt, type: weather, x: 0, y: 1, w: 4, h: 7, options: { entity: weather.home, variant: now } }
      - { id: stunden, type: weather, x: 5, y: 1, w: 7, h: 3, options: { entity: weather.home, variant: hourly, hours: 12 } }
      - { id: tage, type: weather, x: 5, y: 4, w: 7, h: 4, options: { entity: weather.home, variant: daily, days: 5 } }

  - id: zuhause
    name: Zuhause
    duration: 20
    widgets:
      - { id: titel, type: text, x: 0, y: 0, w: 6, h: 1, options: { text: Zuhause, style: label } }
      - { id: uhr, type: clock, x: 9, y: 0, w: 3, h: 1, options: { size: small, align: end } }
      - id: raeume
        type: rooms
        x: 0
        y: 1
        w: 8
        h: 7
        options:
          cold: 16
          warm: 26
          rooms:
            - { name: Wohnzimmer, temperature: sensor.wohnzimmer_temperatur, humidity: sensor.wohnzimmer_luftfeuchte }
            - { name: Küche, temperature: sensor.kueche_temperatur, windows: [binary_sensor.kueche_fenster] }
            - { name: Schlafzimmer, temperature: sensor.schlafzimmer_temperatur, windows: [binary_sensor.schlafzimmer_fenster] }
      - id: status
        type: status
        x: 8
        y: 1
        w: 4
        h: 7
        options:
          windows: auto
          appliances:
            - { entity: sensor.waschmaschine_status, name: Waschmaschine, icon: washer }
          lights: auto
          waste: calendar.muell
          waste_days: 2

  - id: muell
    name: Müll
    duration: 20
    show_if:
      - { condition: within_days, entity: calendar.muell, days: 1 }
    widgets:
      - { id: uhr, type: clock, x: 0, y: 2, w: 7, h: 3, options: { valign: end } }
      - { id: datum, type: date, x: 0, y: 5, w: 7, h: 1, options: { color: accent, size: 28 } }
      - id: muell
        type: calendar
        x: 8
        y: 1
        w: 4
        h: 6
        options: { entity: calendar.muell, variant: card, waste: true }

  - id: nacht
    name: Nacht
    duration: 60
    palette: night
    widgets:
      - { id: uhr, type: clock, x: 3, y: 3, w: 6, h: 2, options: { align: center, valign: end } }
      - { id: datum, type: date, x: 3, y: 5, w: 6, h: 1, options: { align: center, size: 18 } }

events:
  - id: klingel
    name: Klingel
    entity: binary_sensor.haustuer_klingel
    to: "on"
    kind: alarm
    camera: camera.haustuer
    title: Es klingelt
    where: Haustür
    max: 120
    hold_after: 30

  - id: bewegung
    name: Bewegung Haustür
    entity: binary_sensor.haustuer_bewegung
    to: "on"
    kind: live
    camera: camera.haustuer
    title: Bewegung an der Haustür
    duration: 30
    cooldown: 120

  - id: waesche
    name: Waschmaschine
    entity: sensor.waschmaschine_status
    from: run
    to: finished
    kind: info
    icon: washer
    title: Waschmaschine fertig
    chip: Wäsche fertig

  - id: musik
    name: Musik
    kind: media
    entities: [media_player.wohnzimmer]
    style: card
